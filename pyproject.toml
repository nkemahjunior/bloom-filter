[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom_filter"
version = "0.1.0"
description = "Bloom filter implementation for Concepts of Data Science 2025-2026"
authors = [
    { name = "Rexford Holland" },
    { name = "Junior Nkemah Kaving" }
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]